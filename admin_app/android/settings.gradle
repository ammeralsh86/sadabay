pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File("local.properties")
        if (localPropertiesFile.exists()) {
            properties.load(new FileInputStream(localPropertiesFile))
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null) {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }
        if (sdkPath == null) {
            try {
                def stdout = new ByteArrayOutputStream()
                exec {
                    commandLine 'flutter', '--sdk-path'
                    standardOutput = stdout
                }
                sdkPath = stdout.toString().trim()
            } catch (Exception e) {
                // ignore
            }
        }
        return sdkPath
    }()

    if (flutterSdkPath != null && !flutterSdkPath.isEmpty()) {
        includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    }

    plugins {
        id "dev.flutter.plugin-loader" version "1.0.0"
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include ":app"
