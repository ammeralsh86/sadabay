name: Build Admin App

on:
  push:
    branches:
      - main
    paths:
      - 'admin_app/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Prepare Android Platform
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/mada_admin_android
          cd /tmp/mada_admin_android

          flutter create \
            --platforms=android \
            --project-name=mada_pay_admin \
            --org=com.madapay \
            .

          cd "$GITHUB_WORKSPACE/admin_app"

          rm -rf android
          cp -R /tmp/mada_admin_android/android ./android

      - name: Get Dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Analyze Project
        working-directory: admin_app
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: admin_app
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-admin
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
