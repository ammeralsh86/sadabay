name: Build Admin App

on:
  push:
    branches:
      - main
    paths:
      - 'admin_app/**'
      - '.github/workflows/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Create local.properties for admin_app Android
        run: |
          # Android SDK for Gradle
          echo "sdk.dir=/usr/lib/android-sdk" > admin_app/android/local.properties
          # Explicit Flutter SDK path for GitHub runner
          echo "flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.29.3-x64" >> admin_app/android/local.properties

          echo "==== admin_app/android/local.properties ===="
          cat admin_app/android/local.properties

      - name: Show Flutter Version
        run: flutter --version

      - name: Clean Project
        working-directory: admin_app
        run: flutter clean

      - name: Get Dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Analyze Project
        working-directory: admin_app
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: admin_app
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
