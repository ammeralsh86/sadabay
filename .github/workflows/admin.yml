name: Build Admin App

on:
  push:
    branches: [main]
    paths:
      - 'admin_app/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Fresh Flutter Project
        run: flutter create --platforms=android --project-name=mada_pay_admin /tmp/mada_pay_admin

      - name: Copy App Files
        run: |
          cp admin_app/pubspec.yaml /tmp/mada_pay_admin/pubspec.yaml
          cp -r admin_app/lib /tmp/mada_pay_admin/
          if [ -d admin_app/assets ]; then cp -r admin_app/assets /tmp/mada_pay_admin/; fi
          if [ -d admin_app/test ]; then cp -r admin_app/test /tmp/mada_pay_admin/; fi

      - name: Get Dependencies
        working-directory: /tmp/mada_pay_admin
        run: flutter pub get

      - name: Analyze Project
        working-directory: /tmp/mada_pay_admin
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: /tmp/mada_pay_admin
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-admin-release
          path: /tmp/mada_pay_admin/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
