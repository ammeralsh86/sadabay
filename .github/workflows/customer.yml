name: Build Customer App

on:
  push:
    paths:
      - 'customer_app/**'
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Clean
        run: |
          cd customer_app
          flutter clean

      - name: Get dependencies
        run: |
          cd customer_app
          flutter pub get

      - name: Analyze
        run: |
          cd customer_app
          flutter analyze --no-fatal-infos

      - name: Build APK
        run: |
          cd customer_app
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}

      - name: Verify APK
        run: |
          test -f customer_app/build/app/outputs/flutter-apk/app-release.apk || {
            echo "ERROR: APK file was not generated"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-apk
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
