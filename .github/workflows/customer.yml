name: Build Customer App

on:
  push:
    branches:
      - main
    paths:
      - "customer_app/**"
      - ".github/workflows/customer.yml"
  workflow_dispatch:

jobs:
  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Customer Dependencies
        working-directory: customer_app
        run: flutter pub get

      - name: Build Customer APK
        working-directory: customer_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_KEY is missing in GitHub Actions Secrets."
            exit 1
          fi

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-customer-apk
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
