name: Build Customer App

on:
  push:
    branches:
      - main
    paths:
      - 'customer_app/**'
      - '.github/workflows/customer.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Fresh Android Project
        run: flutter create --platforms=android --project-name=mada_pay_customer /tmp/mada_pay_customer

      - name: Copy Customer Files
        run: |
          cp customer_app/pubspec.yaml /tmp/mada_pay_customer/pubspec.yaml
          cp -r customer_app/lib /tmp/mada_pay_customer/
          if [ -d customer_app/assets ]; then cp -r customer_app/assets /tmp/mada_pay_customer/; fi

      - name: Get Dependencies
        working-directory: /tmp/mada_pay_customer
        run: flutter pub get

      - name: Analyze Project
        working-directory: /tmp/mada_pay_customer
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: /tmp/mada_pay_customer
        run: flutter build apk --release

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: mada-pay-customer-release
          path: /tmp/mada_pay_customer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
